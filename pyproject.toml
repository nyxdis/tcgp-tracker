[project]
name = "tcgptracker"
version = "0.0.1"
description = "A Django-based tracker for Pokemon TCG Pocket cards."
authors = [
    {name = "Freydis Mende", email = "freydis.mende@proton.me"}
]
requires-python = ">=3.13,<4.0"
dependencies = [
    "dj-database-url >=2.3.0,<3.0.0",
    "django >=5.2,<6.0",
    "django-widget-tweaks >=1.5.0,<2.0.0",
    "gunicorn >=23.0.0,<24.0.0",
    "psycopg[binary] >=3.2.7,<4.0.0",
    "psycopg-pool >=3.2.6,<4.0.0",
    "whitenoise >=6.9.0,<7.0.0",
    "django-pwa (>=2.0.1,<3.0.0)",
    "tcgdex-sdk (>=2.2.0,<3.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
    "lxml (>=6.1.1,<7.0.0)",
    "redis (>=5.2.1,<6.0.0)",
    "mozilla-django-oidc (>=5.0.2,<6.0.0)"
]

[dependency-groups]
dev = [
    "djlint>=1.36.4,<2.0.0",
    "pylint>=3.3.7,<4.0.0",
    "pre-commit>=4.2.0,<5.0.0",
    "pylint-django>=2.6.1,<3.0.0",
    "black>=25.1.0,<26.0.0",
    "isort>=6.0.1,<7.0.0",
]
test = [
    "pytest>=8.4.1,<9.0.0",
    "pytest-django>=4.9.0,<5.0.0",
]

[tool.uv]
package = false
default-groups = ["dev", "test"]

[tool.isort]
profile = "black"
