name: Docker Build and Deploy (Zero Downtime)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag to deploy'
        required: false
        default: 'latest'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tcgp-tracker
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server with zero downtime (Blue-Green)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e  # Exit on any error

            # Navigate to project directory
            cd docker/tcgp-tracker || cd tcgp-tracker || { echo "❌ Project directory not found"; exit 1; }

            # Pull the latest image
            echo "📥 Pulling latest image..."
            docker pull ghcr.io/${{ github.repository_owner }}/tcgp-tracker:latest

            # Determine current and target colors for blue-green deployment
            if docker ps --format "table {{.Names}}" | grep -q "tcgp-tracker-app-blue"; then
                CURRENT_COLOR="blue"
                TARGET_COLOR="green"
                echo "🔵 Current deployment is BLUE, switching to GREEN"
            else
                CURRENT_COLOR="green"
                TARGET_COLOR="blue"
                echo "🟢 Current deployment is GREEN, switching to BLUE"
            fi

            # Create target compose file for blue-green deployment
            echo "🚀 Starting $TARGET_COLOR deployment..."

            # Copy base compose file and modify for target color
            sed "s/tcgp-tracker-app:/tcgp-tracker-app-$TARGET_COLOR:/g; s/container_name: tcgp-tracker-app/container_name: tcgp-tracker-app-$TARGET_COLOR/g" docker-compose.yml > docker-compose-$TARGET_COLOR.yml

            # Add temporary port mapping for health check
            if [ "$TARGET_COLOR" = "blue" ]; then
                sed -i 's/8000:8000/8001:8000/g' docker-compose-$TARGET_COLOR.yml
            else
                sed -i 's/8000:8000/8002:8000/g' docker-compose-$TARGET_COLOR.yml
            fi

            # Start new deployment
            docker-compose -f docker-compose-$TARGET_COLOR.yml up -d

            # Wait for health check
            echo "⏳ Waiting for $TARGET_COLOR deployment to be healthy..."
            HEALTH_PORT=$([ "$TARGET_COLOR" = "blue" ] && echo "8001" || echo "8002")

            for i in {1..30}; do
                if curl -f http://localhost:$HEALTH_PORT/health/ 2>/dev/null; then
                    echo "✅ $TARGET_COLOR deployment is healthy!"
                    break
                elif [ $i -eq 30 ]; then
                    echo "❌ $TARGET_COLOR deployment failed health check"
                    docker-compose -f docker-compose-$TARGET_COLOR.yml logs app
                    docker-compose -f docker-compose-$TARGET_COLOR.yml down
                    exit 1
                else
                    echo "⏳ Health check attempt $i/30..."
                    sleep 10
                fi
            done

            # Run data import on new deployment
            echo "📊 Running data import on $TARGET_COLOR deployment..."
            docker-compose -f docker-compose-$TARGET_COLOR.yml exec -T app python manage.py import_data

            # Update Traefik labels to switch traffic
            echo "🔄 Switching traffic to $TARGET_COLOR deployment..."
            docker-compose -f docker-compose.yml down

            # Restore original port mapping and update container name in main compose file
            sed -i "s/tcgp-tracker-app:/tcgp-tracker-app-$TARGET_COLOR:/g; s/container_name: tcgp-tracker-app/container_name: tcgp-tracker-app-$TARGET_COLOR/g" docker-compose.yml

            # Start with Traefik labels pointing to new deployment
            docker-compose up -d

            # Clean up old deployment after successful switch
            if [ "$CURRENT_COLOR" != "" ]; then
                echo "🧹 Cleaning up $CURRENT_COLOR deployment..."
                docker-compose -f docker-compose-$CURRENT_COLOR.yml down 2>/dev/null || true
                rm -f docker-compose-$CURRENT_COLOR.yml
            fi

            # Clean up temp compose file
            rm -f docker-compose-$TARGET_COLOR.yml

            echo "✅ Zero-downtime blue-green deployment completed!"
            echo "🔗 Application available at: https://tcgp.freyd.is"
            echo "🎯 Active deployment: $TARGET_COLOR"
