name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: https://github.com/snok/install-poetry@v1

      - name: Install dependencies
        run: |
          poetry install --with dev,test

      - name: Check formatting (black)
        run: poetry run black --check .

      - name: Check imports (isort)
        run: poetry run isort --check .

      - name: Lint (pylint)
        run: poetry run pylint apps/ tcgptracker/

      - name: Lint templates (djlint)
        run: poetry run djlint apps/tracker/templates --check

      - name: Tests
        run: poetry run pytest

  docker-build:
    name: Docker build & push
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v6

      - name: Set registry
        run: echo "REGISTRY=$(echo '${{ github.server_url }}' | sed 's|https://||')" >> $GITHUB_ENV

      - name: Log in to registry
        if: github.event_name == 'push'
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Build image
        run: docker build --build-arg GIT_HASH=${{ github.sha }} -t "$REGISTRY/${{ github.repository }}:${{ github.sha }}" .

      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker push "$REGISTRY/${{ github.repository }}:${{ github.sha }}"
          if [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            docker tag "$REGISTRY/${{ github.repository }}:${{ github.sha }}" "$REGISTRY/${{ github.repository }}:latest"
            docker push "$REGISTRY/${{ github.repository }}:latest"
          fi

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    steps:
      - name: Trigger Portainer webhook
        run: curl -fsSL -X POST "${{ secrets.PORTAINER_WEBHOOK }}"
