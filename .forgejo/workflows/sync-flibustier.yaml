name: Sync flibustier

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Sync data from flibustier
    runs-on: ubuntu-latest
    steps:
      # A personal access token (not the automatic one) so the push below
      # triggers the CI workflow, and with it the deploy.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.SYNC_PUSH_TOKEN }}

      - name: Install uv
        uses: https://github.com/astral-sh/setup-uv@v10.1.0
        with:
          version: '0.12.18'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run sync_flibustier
        run: uv run --frozen python manage.py sync_flibustier

      - name: Commit and push changes
        run: |
          if git diff --quiet -- data/; then
            echo "data/ is up to date, nothing to commit."
            exit 0
          fi
          git config user.name "tcgptracker-bot"
          git config user.email "tcgptracker-bot@noreply.git.freyd.is"
          git add data/
          git commit -m "chore(data): sync from flibustier dataset"
          git push origin HEAD:${{ github.event.repository.default_branch }}
